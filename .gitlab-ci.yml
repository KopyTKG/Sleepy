# GitLab CI for sleepy.
#
# These jobs mirror the justfile: `just ci` runs lint + build + test + package
# locally, with the same commands used here.
#
# - `lint` and `test` run on every push/tag, before anything is built.
# - `lint` and `test` run on every push, so branches stay honest.
# - The three publish jobs and the release only run for a tag (e.g. `v1.0.0`):
#   the binaries are release output, and building them on every branch push
#   costs minutes per pipeline for artifacts nobody downloads.
# - `gui:linux` / `gui:windows` both build on a Linux runner: the Skia desktop
#   head cross-compiles to win-x64.
#
# NOTE: verify against your GitLab version — the generic-packages API and the
# `release-cli` / `release:` syntax below match current GitLab (16.x+). Older
# instances may differ. `CI_JOB_TOKEN`, `CI_API_V4_URL`, `CI_PROJECT_ID`, and
# `CI_COMMIT_TAG` are predefined CI variables and need no configuration.

stages:
  - check
  - build
  - release

variables:
  PACKAGE_NAME: "sleepy"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget"

.dotnet:
  image: mcr.microsoft.com/dotnet/sdk:10.0
  cache:
    key: nuget-$CI_COMMIT_REF_SLUG
    paths:
      - .nuget/

lint:
  extends: .dotnet
  stage: check
  script:
    - dotnet format --verify-no-changes

test:
  extends: .dotnet
  stage: check
  script:
    - dotnet test tests/Sleepy.Core.Tests/Sleepy.Core.Tests.csproj -c Release --nologo --logger "junit;LogFilePath=$CI_PROJECT_DIR/test-results.xml"
  artifacts:
    when: always
    reports:
      junit: test-results.xml
    expire_in: 1 week

# Native AOT command line tool. AOT links with clang and needs the zlib headers.
cli:linux:
  extends: .dotnet
  stage: build
  rules:
    - if: "$CI_COMMIT_TAG"
  before_script:
    - apt-get update -y
    - apt-get install -y --no-install-recommends clang zlib1g-dev
  script:
    - dotnet publish src/Sleepy.Cli/Sleepy.Cli.csproj -c Release -r linux-x64 -o publish/cli
    - ./publish/cli/sleepy --version
    - ./publish/cli/sleepy -h || true
    - cp publish/cli/sleepy ./sleepy
  artifacts:
    paths:
      - sleepy
    expire_in: 1 week

# The published folder carries the X11 / Wayland / console launchers, the
# desktop entries, and install.sh alongside the binary.
gui:linux:
  extends: .dotnet
  stage: build
  rules:
    - if: "$CI_COMMIT_TAG"
  script:
    - dotnet publish src/Sleepy.Gui/Sleepy.Gui.csproj -c Release -f net10.0-desktop -r linux-x64 --self-contained -o publish/gui-linux
    - tar -czf sleepy-gui-linux-x64.tar.gz -C publish/gui-linux .
  artifacts:
    paths:
      - sleepy-gui-linux-x64.tar.gz
    expire_in: 1 week

gui:windows:
  extends: .dotnet
  stage: build
  rules:
    - if: "$CI_COMMIT_TAG"
  script:
    - dotnet publish src/Sleepy.Gui/Sleepy.Gui.csproj -c Release -f net10.0-desktop -r win-x64 --self-contained -o publish/gui-win
    - cd publish/gui-win && zip -qr ../../sleepy-gui-win-x64.zip . && cd ../..
  before_script:
    - apt-get update -y
    - apt-get install -y --no-install-recommends zip
  artifacts:
    paths:
      - sleepy-gui-win-x64.zip
    expire_in: 1 week

# Upload the artifacts built above to the generic package registry. The
# release-cli image has no curl, so the upload runs in an image that does and
# the release job below only has to create the release.
upload:
  stage: release
  image: curlimages/curl:latest
  needs:
    - job: cli:linux
      artifacts: true
    - job: gui:linux
      artifacts: true
    - job: gui:windows
      artifacts: true
  rules:
    - if: "$CI_COMMIT_TAG"
  script:
    - |
      for asset in sleepy sleepy-gui-linux-x64.tar.gz sleepy-gui-win-x64.zip; do
        echo "uploading $asset"
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "./$asset" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${CI_COMMIT_TAG}/${asset}"
      done

# Publish the AUR packages, once the assets they point at exist. Only runs when
# an SSH key for the AUR is configured, so a fork without one simply skips it.
aur:
  stage: release
  image: archlinux:base-devel
  needs:
    - job: release
      artifacts: false
  rules:
    - if: "$CI_COMMIT_TAG && $AUR_SSH_PRIVATE_KEY"
  before_script:
    - pacman -Sy --noconfirm --needed openssh git pacman-contrib
    # makepkg refuses to run as root, so the packaging happens as an ordinary user.
    - useradd --create-home builder
    - install -dm700 -o builder -g builder /home/builder/.ssh
    - printf '%s\n' "$AUR_SSH_PRIVATE_KEY" | tr -d '\r' > /home/builder/.ssh/aur
    - printf 'Host aur.archlinux.org\n  IdentityFile ~/.ssh/aur\n  User aur\n  StrictHostKeyChecking accept-new\n' > /home/builder/.ssh/config
    - chmod 600 /home/builder/.ssh/aur /home/builder/.ssh/config
    - chown -R builder:builder /home/builder/.ssh
  script:
    # The script is written out rather than passed to su, so that no quoting has
    # to survive two shells.
    - |
      cat > /tmp/publish-aur.sh <<'SCRIPT'
      #!/bin/bash
      set -euo pipefail

      git config --global user.name "sleepy release"
      git config --global user.email "${AUR_EMAIL:-noreply@example.com}"

      cd "$(mktemp -d)"
      for package in sleepy-bin sleepy-gui-bin; do
        git clone --quiet "ssh://aur@aur.archlinux.org/${package}.git" "$package"
        cp "${PROJECT_DIR}/packaging/aur/${package}/PKGBUILD" "${package}/PKGBUILD"
        cd "$package"

        sed -i "s|^pkgver=.*|pkgver=${VERSION}|; s|^pkgrel=.*|pkgrel=1|" PKGBUILD

        # Checksums come from the assets this pipeline just published, so the
        # PKGBUILD in the repository is a template rather than a second source of
        # truth that can fall out of date.
        updpkgsums
        makepkg --printsrcinfo > .SRCINFO

        if git diff --quiet; then
          echo "${package}: already at ${VERSION}"
        else
          git commit -aqm "Update to ${VERSION}"
          git push --quiet
          echo "${package}: pushed ${VERSION}"
        fi
        cd ..
      done
      SCRIPT
    - chmod 755 /tmp/publish-aur.sh
    - chmod -R a+rX "$CI_PROJECT_DIR"
    - runuser -u builder -- env VERSION="${CI_COMMIT_TAG#v}" PROJECT_DIR="$CI_PROJECT_DIR" AUR_EMAIL="${AUR_EMAIL:-}" /tmp/publish-aur.sh

# Cut the Release that links to the uploaded packages. Only runs on tags.
#
# Done with the API rather than the `release:` keyword so that re-running a tag
# pipeline is safe: the keyword refuses when a release already exists, which is
# exactly what a re-run finds. Creating is tried first, updating second, and the
# asset links are added only when they are missing.
release:
  stage: release
  image: curlimages/curl:latest
  needs:
    - job: upload
      artifacts: false
  rules:
    - if: "$CI_COMMIT_TAG"
  variables:
    PACKAGE_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${CI_COMMIT_TAG}"
  script:
    - |
      set -eu
      api="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
      auth="JOB-TOKEN: $CI_JOB_TOKEN"
      description="Automated release of sleepy ${CI_COMMIT_TAG} (CLI + desktop app)."

      body=$(printf '{"name":"sleepy %s","tag_name":"%s","description":"%s"}' \
        "$CI_COMMIT_TAG" "$CI_COMMIT_TAG" "$description")

      status=$(curl --silent --output /tmp/release.json --write-out '%{http_code}' \
        --request POST --header "$auth" --header "Content-Type: application/json" \
        --data "$body" "$api")
      echo "create release: HTTP $status"

      if [ "$status" = "409" ]; then
        echo "release exists; updating it instead"
        curl --fail --silent --show-error --output /dev/null \
          --request PUT --header "$auth" --header "Content-Type: application/json" \
          --data "$body" "$api/${CI_COMMIT_TAG}"
      elif [ "$status" != "201" ]; then
        cat /tmp/release.json
        exit 1
      fi

      existing=$(curl --silent --header "$auth" "$api/${CI_COMMIT_TAG}/assets/links")
      for asset in sleepy sleepy-gui-linux-x64.tar.gz sleepy-gui-win-x64.zip; do
        case "$asset" in
          sleepy) label="sleepy CLI (linux-x64)" ;;
          sleepy-gui-linux-x64.tar.gz) label="sleepy-GUI (linux-x64)" ;;
          *) label="sleepy-GUI (win-x64)" ;;
        esac

        if echo "$existing" | grep -q "$PACKAGE_URL/$asset\""; then
          echo "link already present: $label"
          continue
        fi

        echo "adding link: $label"
        curl --fail --silent --show-error --output /dev/null \
          --request POST --header "$auth" \
          --data-urlencode "name=$label" \
          --data-urlencode "url=$PACKAGE_URL/$asset" \
          --data "link_type=package" \
          "$api/${CI_COMMIT_TAG}/assets/links"
      done
