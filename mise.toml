#:schema https://mise.jdx.dev/schema/mise.json
#
# Toolchain for sleepy. `mise install` gets everything; `just` then drives the
# actual build, test, and publish tasks (see the justfile).

[tools]
dotnet = "10.0.302"
just = "latest"

[env]
DOTNET_NOLOGO = "1"
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
DOTNET_SKIP_FIRST_TIME_EXPERIENCE = "1"
# Keep the terminal output readable when several projects build at once.
DOTNET_CLI_UI_LANGUAGE = "en"

[settings]
# The Uno SDK version is pinned in global.json; don't let mise fight it.
idiomatic_version_file_enable_tools = []

[tasks.setup]
description = "Restore NuGet packages for the whole solution"
run = "dotnet restore"

[tasks.build]
description = "Build everything (alias for `just build`)"
run = "just build"

[tasks.test]
description = "Run the test suite (alias for `just test`)"
run = "just test"

[tasks.ci]
description = "Everything CI runs: lint, build, test, publish (alias for `just ci`)"
run = "just ci"
