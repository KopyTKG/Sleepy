[tools]
dotnet = "10.0.302"
just = "latest"
jq = "1.8.1"

[env]
DOTNET_NOLOGO = "1"
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
DOTNET_SKIP_FIRST_TIME_EXPERIENCE = "1"
DOTNET_CLI_UI_LANGUAGE = "en"

[settings]
idiomatic_version_file_enable_tools = []

[tasks.setup]
description = "Restore NuGet packages for the whole solution"
run = "dotnet restore"

[tasks.build]
description = "Build everything (alias for `just build`)"
run = "just build"

[tasks.test]
description = "Run the test suite (alias for `just test`)"
run = "just test"

[tasks.ci]
description = "Everything CI runs: lint, build, test, publish (alias for `just ci`)"
run = "just ci"
