name: Bug report
description: Something sleepy produced, or did, that it should not have.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The specification that triggered it is the most
        useful thing you can attach — nearly every conversion bug is obvious once
        the document that caused it is in hand.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: specification
    attributes:
      label: The specification
      description: >
        Attach it, paste it, or reduce it to the smallest document that still
        shows the problem. A private spec is fine reduced: keep the shape, change
        the names.
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - sleepy (command line)
        - sleepy-GUI (desktop)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`sleepy --version`, or the status bar / About dialog in sleepy-GUI."
      placeholder: 0.6.1+b186424
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Arch Linux, Wayland / Windows 11
  - type: textarea
    id: steps
    attributes:
      label: Command or steps
      render: shell
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The error message, or the part of the export that came out wrong.
      render: text
